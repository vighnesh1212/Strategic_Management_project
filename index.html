<style>

kground:#f0fafb;border:1px solid #c9e7e8;border-radius:10px;padding:12px;margin:12px 0}.analysis-state .pulse{width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(27,154,170,.5);animation:pulse 1.5s infinite}.analysis-state.done{background:#f1fbf6;border-color:#c7e8d6}.analysis-state.done .pulse{background:var(--ok);animation:none}.analysis-state.fail{background:#fff6f4;border-color:#f0c9c3}.analysis-state.fail .pulse{background:var(--bad);animation:none}@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(27,154,170,0)}}.context-list{display:grid;gap:9px}.context-list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:7px;font-size:13px}.context-list span{color:var(--mute)}.advisor-shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}.advisor-rail{position:sticky;top:18px}.advisor-rail .card{margin-bottom:12px}.advisor-main{min-width:0}.advisor-main .chat{height:510px;background:#f6f9fb}.advisor-main .m{max-width:78%}.advisor-main .chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.advisor-main .chips button{border:1px solid #b9dfe1;background:#f0fafb;color:var(--navy);border-radius:99px;padding:6px 10px;cursor:pointer;font-size:12px}.advisor-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.advisor-head h3{margin:0}.muted-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:800}
.gen-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}.gen-status{display:inline-flex;align-items:center;gap:6px;color:#226e75;background:#e7f5f5;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:800}.gen-status:before{content:'✦';color:var(--teal)}.gen-chat{display:flex;flex-direction:column;gap:10px}.message-meta{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:10px;color:var(--mute)}.source-chip{display:inline-block;background:#edf4f7;color:#2e6470;border-radius:99px;padding:2px 7px;margin:5px 4px 0 0;font-size:10px}.feedback{display:flex;gap:5px;margin-top:5px}.feedback button{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:11px;padding:1px 4px}.feedback button:hover{color:var(--teal)}.composer-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}.composer-tools span{font-size:11px;color:var(--mute)}.composer-tools button{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer}.audit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.audit-card{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcfd}.audit-card b{display:block;color:var(--navy);margin-bottom:3px}.audit-card span{font-size:12px;color:var(--mute)}.map-chip{display:inline-block;border:1px solid #b9dfe1;background:#f0fafb;color:#126b73;border-radius:99px;padding:4px 8px;margin:4px 4px 0 0;font-size:11px}.score-ring{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--score)*1%),#e8edf3 0);position:relative}.score-ring:after{content:'';position:absolute;inset:7px;border-radius:50%;background:#fff}.score-ring strong{position:relative;z-index:1;color:var(--navy);font-size:16px}.source-list{margin:0;padding-left:17px}.source-list li{margin:4px 0;color:var(--mute);font-size:12px}@media(max-width:900px){.ai-grid,.advisor-shell{grid-template-columns:1fr}.advisor-rail{position:static}.advisor-main .chat{height:420px}.audit-grid{grid-template-columns:1fr 1fr}}@media(max-width:900px){.ai-grid,.advisor-shell{grid-template-columns:1fr}.advisor-rail{position:static}.advisor-main .chat{height:420px}}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-bottom:16px}.cg>.card{margin:0}

@media(max-width:800px){#app{grid-template-columns:1fr}nav{position:fixed;left:-260px;width:250px;z-index:8;transition:left .2s}nav.open{left:0}.menu{display:block}main{padding:56px 14px 24px}}
.cbox{position:fixed;right:20px;bottom:76px;width:370px;max-width:calc(100vw - 24px);height:480px;max-height:calc(100vh - 100px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(15,42,74,.28);display:flex;flex-direction:column;z-index:20;overflow:hidden}
.cbox header{background:var(--navy);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.cbox header button{background:none;border:0;color:#fff;cursor:pointer;padding:2px 8px;border-radius:6px}.cbox header button:hover{background:var(--navy2)}
.cbox .chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line)}
.cbox .chips button{border:1px solid var(--teal);background:#f0fafb;color:var(--navy);border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer}
.cbox .chat{flex:1;height:auto;border:0;border-radius:0}
.cbox .cin{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}.cbox .cin input{flex:1;min-width:0}

.splash.hide{opacity:0;pointer-events:none}
.splash h1{margin:0;font-size:clamp(34px,8vw,64px);letter-spacing:.5px}
.splash p{margin:14px 0 0;font-size:clamp(15px,3.2vw,22px);color:#cfe9ee;max-width:640px}
.splash .ld{margin-top:34px;width:min(260px,70vw);height:4px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.splash .ld i{display:block;height:100%;width:0;background:#fff;animation:ld 4s linear forwards}
@keyframes ld{to{width:100%}}
@media print{.splash{display:none}nav,.fab,.menu,.noprint{display:none!important}#app{display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="splash" id="splash" role="status" aria-label="UniStrategix is loading"><h1>UniStrategix</h1><p>Transform University Data into Strategic Decisions.</p><div class="ld"><i></i></div></div>
<button class="btn menu" id="menu" aria-label="Toggle navigation">Menu</button>
<div id="app"><nav id="nav" aria-label="Main"></nav><main id="main"></main></div>
<button class="fab" id="fab">Uni Copilot</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAGES=['Dashboard','Report Upload Center','Analysis Findings','Situation Analysis','Strategy Alternatives','Strategy Simulator','Strategic Goals','Implementation Planner','Monitoring and KPIs','Uni Copilot','Reports and Exports','Settings','Data Explorer (any file)'];
const CATS=['Research Performance Report','Financial and Budget Report','Faculty and Human Resources Report','Academic Quality Report','Industry Collaboration Report','Infrastructure and Laboratory Report','Strategic Planning Report','Institutional Performance Report','Other'];
const ROLES=['Professor','Head of Department (HOD)','Dean','Research Director','University Administrator'];
const APPROVERS=['Head of Department (HOD)','Dean','University Administrator'];
const S={page:0,user:null,demo:false,reports:[],metrics:[],goals:[],tasks:[],swot:[],short:{},chat:[],consent:false,planApproved:false,corr:{},
 alloc:{lab:6,ind:5,fac:4,pub:3,oth:0},total:20,over:false,w:{impact:40,feas:25,align:25,risk:10},toast:'',ai:{status:'idle',step:'Waiting for a report',progress:0,quality:null,format:'',brief:'',findings:[],recommendations:[],facts:[],warnings:[],extractionMode:''}};
const ALT=[
 {id:'a1',n:'Upgrade research laboratories',p:'Research output below target',b:'₹8–12 lakh',t:'12–18 months',f:'Medium',r:'Procurement delays; under-use of equipment',k:'Publications per faculty; lab utilisation'},
 {id:'a2',n:'Formal industry collaboration programme',p:'Few industry-linked projects',b:'₹4–6 lakh',t:'9–15 months',f:'Medium',r:'Partner commitment is uncertain',k:'Active MoUs; funded collaborative projects'},
 {id:'a3',n:'Faculty research development and publication support',p:'Limited research capacity',b:'₹3–5 lakh',t:'6–12 months',f:'High',r:'Workload conflicts for faculty',k:'Indexed papers; grant proposals submitted'}];
const ASSUME={lab:{n:'Research laboratory improvement',i:4,f:3,a:4,r:3},ind:{n:'Industry collaboration',i:4,f:3,a:5,r:3},fac:{n:'Faculty development',i:3,f:5,a:4,r:1},pub:{n:'Research publication support',i:3,f:4,a:3,r:2},oth:{n:'Other strategic initiatives',i:2,f:3,a:2,r:2}};
const DEMO={metrics:[
 {name:'Indexed publications',period:'AY 2023-24',target:120,actual:84,unit:'papers',category:CATS[0]},
 {name:'Research grants received',period:'AY 2023-24',target:60,actual:41,unit:'₹ lakh',category:CATS[1]},
 {name:'Research budget spent',period:'AY 2023-24',target:45,actual:44,unit:'₹ lakh',category:CATS[1]},
 {name:'Faculty development programmes',period:'AY 2023-24',target:12,actual:13,unit:'count',category:CATS[2]},
 {name:'Active industry MoUs',period:'AY 2023-24',target:10,actual:4,unit:'count',category:CATS[4]},
 {name:'Lab equipment availability',period:'AY 2023-24',target:90,actual:72,unit:'%',category:CATS[5]}].map(m=>({...m,source:'DEMO sample data'})),
 goals:[{t:'Raise indexed publications',base:70,target:120,unit:'papers',due:'2025-06-30',pri:'High',resp:'Research Director',status:'Active',src:'DEMO'}],
 tasks:[{t:'Audit lab equipment',resp:'HOD',start:'2025-01-10',due:'2025-02-28',budget:0.5,status:'In Progress',goal:'Raise indexed publications'},{t:'Sign two industry MoUs',resp:'Dean',start:'2025-02-01',due:'2025-05-30',budget:1,status:'Not Started',goal:'Raise indexed publications'}]};
const status=m=>{if(m.target==null||m.actual==null||!m.target)return['No comparison','']; const r=m.actual/m.target;return r>=1?['On track','ok']:r>=.8?['At risk','warn']:['Behind','bad']};
const pct=m=>m.target&&m.actual!=null?Math.round(m.actual/m.target*100):null;
function toast(t){S.toast=t;render();setTimeout(()=>{S.toast='';const e=$('#toast');if(e)e.remove()},3000)}
function nav(){$('#nav').innerHTML='<h1>UniStrategix</h1><small>Transform University Data into Strategic Decisions.</small>'+[0,1,12,2,3,4,6,8,9,10].map(i=>`<button class="${i==S.page?'on':''}" data-go="${i}" ${i==S.page?'aria-current="page"':''}>${PAGES[i]}</button>`).join('')+`<div style="margin:16px 8px 6px;font-size:12px;color:#9fb4cf;word-break:break-all">${esc(S.user.name)}<br>${esc(S.user.email)}</div><button data-act="logout">Sign out</button>`}
function head(t,sub){return `<header class="top"><div><h2>${t}</h2><p class="sub">${sub}</p></div><div>${S.demo?'<span class="pill demo">DEMO WORKSPACE — sample data</span>':''} <span class="pill">${esc(S.user.uni)} / ${esc(S.user.dept)}</span></div></header>`+(S.toast?`<div id="toast" class="banner" role="status">${esc(S.toast)}</div>`:'')}
function noData(){return `<div class="card empty"><h3>No verified data yet</h3><p>Upload a CSV report in the Report Upload Center and confirm it, or load the clearly labeled demo workspace.</p><button class="btn" data-go="1">Upload reports</button> <button class="btn alt" data-act="demo">Load demo workspace</button>${S.dsets.length?' <button class="btn t" data-go="12">Open Data Explorer</button>':''}</div>`}
function verified(){return S.metrics.filter(m=>m.verified||m.source==='DEMO sample data')}
function chart(ms){if(!ms.length)return'';const W=520,h=26;return `<svg viewBox="0 0 ${W} ${ms.length*h+8}" role="img" aria-label="Actual versus target percent" style="width:100%;max-width:640px">`+ms.map((m,i)=>{const p=Math.min(pct(m)??0,150);return `<text x="0" y="${i*h+17}" font-size="12" fill="#1c2733">${esc(m.name.slice(0,26))}</text><rect x="190" y="${i*h+5}" width="300" height="14" rx="4" fill="#e8edf3"/><rect x="190" y="${i*h+5}" width="${p*2}" height="14" rx="4" fill="${p>=100?'#1f8a5b':p>=80?'#c27c0e':'#c0392b'}"/><text x="${W-26}" y="${i*h+17}" font-size="12" text-anchor="end">${p}%</text>`}).join('')+'</svg>'}
function donut(parts){const tot=parts.reduce((a,p)=>a+p[1],0)||1;let off=0;const r=40,C=2*Math.PI*r;return `<svg viewBox="0 0 230 110" style="width:100%;max-width:340px" role="img" aria-label="Status chart"><g transform="translate(55,55) rotate(-90)">`+parts.map(p=>{const l=p[1]/tot*C,o=`<circle r="${r}" fill="none" stroke="${p[2]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l;return o}).join('')+`</g>`+parts.map((p,i)=>`<rect x="125" y="${24+i*24}" width="12" height="12" fill="${p[2]}"/><text x="143" y="${35+i*24}" font-size="12" fill="#1c2733">${p[0]}: ${p[1]}</text>`).join('')+'</svg>'}
